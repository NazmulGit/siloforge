[package]
name = "sf-embed"
description = "SiloForge embedding chain (remote, ONNX Runtime, candle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["onnx"]
# ONNX Runtime via `ort` load-dynamic (onnxruntime.dll found at runtime; CPU EP + DirectML EP).
onnx = ["dep:ort", "dep:tokenizers"]
# Pure-Rust fallback (no DLL), ~15 texts/s on CPU.
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:rayon"]

[dependencies]
sf-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
zip.workspace = true
# R11: below-normal inference threads (same pin as sf-jobs)
thread-priority = "=3.1.1"
rayon = { workspace = true, optional = true }

ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }

[dev-dependencies]
axum.workspace = true


[[example]]
name = "bench"
required-features = ["onnx"]
